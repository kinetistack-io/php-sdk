name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UBUNTU_MIRROR: azure.archive.ubuntu.com

jobs:
  matrix-tests:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Ubuntu mirror
        run: |
          UBUNTU_MIRROR="${UBUNTU_MIRROR:-azure.archive.ubuntu.com}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#http://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#https://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR%/}"
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$file" ]; then
              $SUDO sed -i -E "s#https?://(archive|security)\.ubuntu\.com#http://${UBUNTU_MIRROR}#g" "$file"
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, intl, pcntl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  quality-checks:
    name: Code Style & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Ubuntu mirror
        run: |
          UBUNTU_MIRROR="${UBUNTU_MIRROR:-azure.archive.ubuntu.com}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#http://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#https://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR%/}"
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$file" ]; then
              $SUDO sed -i -E "s#https?://(archive|security)\.ubuntu\.com#http://${UBUNTU_MIRROR}#g" "$file"
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, intl, pcntl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer check
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan analysis
        run: vendor/bin/phpstan analyse
