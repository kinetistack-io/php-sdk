name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  UBUNTU_MIRROR: azure.archive.ubuntu.com

jobs:
  matrix-tests:
    name: PHPUnit (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          - php-version: '8.2'
            dependencies: 'lowest'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Ubuntu mirror
        run: |
          UBUNTU_MIRROR="${UBUNTU_MIRROR:-azure.archive.ubuntu.com}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#http://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#https://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR%/}"
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$file" ]; then
              $SUDO sed -i -E "s#https?://(archive|security)\.ubuntu\.com#http://${UBUNTU_MIRROR}#g" "$file"
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, intl, pcntl, posix, zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Configure Composer GitHub token
        if: env.GH_TOKEN != ''
        run: composer config --global --auth github-oauth.github.com "$GH_TOKEN"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ matrix.dependencies }}-

      - name: Install dependencies (prefer-lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-progress

      - name: Validate platform requirements
        run: composer check-platform-reqs

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  quality-checks:
    name: Code Style & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Ubuntu mirror
        run: |
          UBUNTU_MIRROR="${UBUNTU_MIRROR:-azure.archive.ubuntu.com}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#http://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR#https://}"
          UBUNTU_MIRROR="${UBUNTU_MIRROR%/}"
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$file" ]; then
              $SUDO sed -i -E "s#https?://(archive|security)\.ubuntu\.com#http://${UBUNTU_MIRROR}#g" "$file"
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, intl, pcntl, posix, zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Configure Composer GitHub token
        if: env.GH_TOKEN != ''
        run: composer config --global --auth github-oauth.github.com "$GH_TOKEN"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Validate platform requirements
        run: composer check-platform-reqs

      - name: Composer security audit
        run: composer audit

      - name: PHP CS Fixer check
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M
