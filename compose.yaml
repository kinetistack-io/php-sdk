name: kinetistack-php-sdk

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.4"
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      - COMPOSER_HOME=/tmp/composer-cache

  php82:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.2"
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      - COMPOSER_HOME=/tmp/composer-cache

  php83:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.3"
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      - COMPOSER_HOME=/tmp/composer-cache

  php84:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.4"
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      - COMPOSER_HOME=/tmp/composer-cache

  php85:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.5"
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      - COMPOSER_HOME=/tmp/composer-cache

volumes:
  composer_cache:
